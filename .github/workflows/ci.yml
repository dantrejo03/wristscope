# Runs on every push to main and on every pull request. The badge in README.md shows the result.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # Finish every version even when one fails, to see which versions a failure affects.
      fail-fast: false
      matrix:
        # The oldest version pyproject.toml allows, and a recent one.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # -v names each test as it starts, and --capture=sys lets messages from Qt and C code
      # through, so a crash shows where and why instead of just "Aborted".
      - run: pytest -v --capture=sys
        env:
          PYTHONUNBUFFERED: "1"

  apps:
    name: iPhone and watch apps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # Pinned, so the build doesn't change when GitHub updates the runner's default Xcode.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build both apps for the simulator
        # No signing: that needs an Apple developer account, and the simulator doesn't check it.
        run: >
          xcodebuild build -quiet
          -project xcode/Wristscope.xcodeproj
          -scheme Wristscope
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
      - name: Test the watch app
        run: >
          xcodebuild test -quiet
          -project xcode/Wristscope.xcodeproj
          -scheme "Wristscope Watch App"
          -destination "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=26.5"
          CODE_SIGNING_ALLOWED=NO
      - name: Check the test fixtures match the Swift formatters
        # The Python tests read these files, so they must be what the Swift code writes today.
        run: |
          sh tools/swift_fixtures/generate.sh
          git diff --exit-code tests/fixtures || {
            echo "::error::tests/fixtures is out of date. Run tools/swift_fixtures/generate.sh and commit the result."
            exit 1
          }
