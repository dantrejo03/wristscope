[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wristscope"
version = "0.1.0"
description = "Real-time oscilloscope for Apple Watch CoreMotion data"
readme = "README.md"
requires-python = ">=3.11"
# pyqtgraph is pinned because watch_view.py uses its 0.14 shader interface.
dependencies = ["numpy", "pyqtgraph>=0.14,<0.15", "PySide6", "PyOpenGL", "zeroconf"]

[project.optional-dependencies]
# trimesh is only needed to rerun tools/convert_watch_model.py.
dev = ["pytest", "trimesh"]

[project.scripts]
wristscope = "wristscope.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
